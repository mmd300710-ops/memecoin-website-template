<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080507">
<meta name="description" content="DarkOx Finance — enter the dark dimension. Verify official contract and project information before interacting.">
<title>DarkOx Finance | Enter the Dark Dimension</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap');

:root {
  --bg: #080507;
  --red: #ed123d;
  --bright: #ff3159;
  --muted: #8d7880;
  --line: rgba(255,35,76,.23);
  --white: #f8edf0;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 85px;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--white);
  font-family: 'Rajdhani', sans-serif;
  overflow-x: hidden;
}

body:before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -3;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 78% 15%, rgba(125,0,33,.19), transparent 35%),
    radial-gradient(ellipse at 15% 65%, rgba(100,0,20,.14), transparent 42%),
    linear-gradient(115deg,#050405,#10070b 52%,#060406);
}

body:after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  opacity: .10;
  background: repeating-linear-gradient(
    0deg,
    transparent 0 3px,
    rgba(255,255,255,.045) 4px
  );
}

a {
  color: inherit;
  text-decoration: none;
}

button { font: inherit; }

.wrap {
  width: min(1180px,92%);
  margin: auto;
}

section {
  position: relative;
  padding: 100px 0;
}

h1, h2, h3, .brand, .eyebrow, .btn, .stat-label {
  font-family: 'Orbitron', sans-serif;
}

/* AMBIENT BACKGROUND */

.ambience {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
}

.mist {
  position: absolute;
  width: 55vw;
  height: 55vw;
  max-width: 700px;
  max-height: 700px;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .10;
  background: #c00034;
  animation: mistDrift 17s ease-in-out infinite alternate;
}

.mist.one {
  top: -15%;
  left: -20%;
}

.mist.two {
  right: -25%;
  top: 35%;
  background: #650020;
  animation-delay: -8s;
}

.mist.three {
  left: 20%;
  bottom: -45%;
  background: #a00029;
  animation-delay: -4s;
}

@keyframes mistDrift {
  from { transform: translate(-5%,0) scale(.8); }
  to { transform: translate(16%,12%) scale(1.25); }
}

#particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

main, header, footer {
  position: relative;
  z-index: 1;
}

/* NAVIGATION */

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(7,4,6,.88);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--line);
}

.nav {
  min-height: 74px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: -.5px;
}

.brand b { color: var(--red); }

.logo-mark {
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  border: 1px solid var(--bright);
  border-radius: 50%;
  color: var(--bright);
  box-shadow: 0 0 20px #ed123d40, inset 0 0 13px #ed123d24;
  animation: logoPulse 3s infinite, logoRotate 18s linear infinite;
}

.logo-mark svg {
  width: 27px;
  height: 27px;
}

@keyframes logoPulse {
  0%,100% { box-shadow: 0 0 8px #ed123d33; }
  50% { box-shadow: 0 0 24px #ed123d90, inset 0 0 14px #ed123d50; }
}

@keyframes logoRotate {
  to { transform: rotate(360deg); }
}

.navlinks {
  display: flex;
  gap: 28px;
  align-items: center;
}

.navlinks a {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  color: #bbaab0;
  transition: .25s;
  letter-spacing: .5px;
}

.navlinks a:hover {
  color: var(--bright);
  text-shadow: 0 0 12px var(--red);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border: 1px solid var(--red);
  padding: 13px 18px;
  background: linear-gradient(120deg,#a9002d,#e20b39);
  color: white;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .5px;
  cursor: pointer;
  transition: .25s;
  box-shadow: 0 0 22px #d4003228;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 30px #ed123d65;
}

.btn.ghost {
  background: #12080d;
  color: #ff6884;
}

.menu-btn {
  display: none;
  background: none;
  border: 1px solid var(--line);
  color: white;
  padding: 9px;
}

/* HERO */

.hero {
  min-height: 660px;
  display: flex;
  align-items: center;
  padding: 78px 0 92px;
  overflow: hidden;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  align-items: center;
  gap: 30px;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--bright);
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
}

.eyebrow:before {
  content: "";
  width: 27px;
  height: 1px;
  background: var(--bright);
  box-shadow: 0 0 10px var(--red);
}

.hero h1 {
  font-size: clamp(42px,6.5vw,79px);
  line-height: .99;
  letter-spacing: -4px;
  margin: 0 0 25px;
  font-weight: 900;
  text-transform: uppercase;
  text-shadow: 0 0 25px #ff17442a;
}

.hero h1 .red {
  color: var(--red);
  display: block;
}

.glitch {
  position: relative;
  animation: titleFlicker 7s infinite;
}

.glitch:after {
  content: attr(data-text);
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  color: #ff3159;
  opacity: 0;
  clip-path: inset(45% 0 40% 0);
  transform: translateX(3px);
  pointer-events: none;
  animation: glitchSlice 5s infinite;
}

@keyframes titleFlicker {
  0%,94%,96%,100% { opacity: 1; transform: translateX(0); }
  95% { opacity: .78; transform: translateX(2px); }
  97% { opacity: .92; transform: translateX(-2px); }
}

@keyframes glitchSlice {
  0%,90%,100% { opacity: 0; }
  91% { opacity: .7; clip-path: inset(15% 0 70% 0); transform: translateX(-4px); }
  93% { opacity: .5; clip-path: inset(55% 0 20% 0); transform: translateX(4px); }
}

.hero-copy {
  max-width: 510px;
  color: #a89aa0;
  font-size: 17px;
  line-height: 1.7;
}

.hero-copy strong { color: #f7dce4; }

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 28px 0;
}

.contract-label {
  font-family: 'Orbitron', sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
  color: #a98e98;
  margin: 25px 0 9px;
}

.contract {
  display: flex;
  max-width: 510px;
  min-width: 0;
  border: 1px solid #722035;
  background: #0d070a;
  padding: 5px;
  gap: 8px;
  box-shadow: 0 0 22px #ed123d10;
}

.contract code {
  font: 11px 'Rajdhani', sans-serif;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  align-self: center;
  padding: 0 8px;
  color: #e6c7d0;
  flex: 1;
  min-width: 0;
}

.contract button {
  border: 0;
  background: #c90935;
  color: white;
  padding: 12px 14px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}

.socials {
  display: flex;
  gap: 9px;
  margin-top: 15px;
}

.socials a {
  width: 38px;
  height: 35px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  color: #e2b8c4;
  background: #14080d;
  transition: .25s;
}

.socials a:hover {
  color: white;
  background: #9f092e;
  transform: translateY(-3px);
}

/* ANIMATED SIGIL */

.sigil-stage {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 440px;
}

.sigil-halo {
  position: absolute;
  width: min(36vw,400px);
  aspect-ratio: 1;
  border: 1px solid #e8154438;
  border-radius: 50%;
  box-shadow: 0 0 90px #b3002721, inset 0 0 70px #a0002014;
  animation: halo 8s linear infinite;
}

.sigil-halo:before,
.sigil-halo:after {
  content: "";
  position: absolute;
  inset: 8%;
  border: 1px dashed #ff28545c;
  border-radius: 50%;
}

.sigil-halo:after {
  inset: 18%;
  border-style: solid;
  transform: rotate(30deg);
}

@keyframes halo {
  to { transform: rotate(360deg); }
}

.sigil {
  width: min(32vw,340px);
  max-width: 100%;
  filter: drop-shadow(0 0 13px #ff174b8c);
  animation: sigilFloat 5s ease-in-out infinite;
}

@keyframes sigilFloat {
  0%,100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-15px) rotate(2deg); }
}

.sigil path,
.sigil circle,
.sigil line,
.sigil polygon {
  stroke: #ff2858;
  stroke-width: 1.25;
  fill: none;
  vector-effect: non-scaling-stroke;
}

.sigil .fill {
  fill: #ed123d;
  stroke: #ff7892;
}

.sigil-caption {
  position: absolute;
  bottom: 12px;
  font-family: 'Orbitron', sans-serif;
  font-size: 9px;
  letter-spacing: 3px;
  color: #7f263c;
  text-align: center;
}

.sigil-caption span { color: var(--red); }

/* SECTION HEADINGS */

.section-head {
  text-align: center;
  margin: 0 auto 44px;
}

.section-head .eyebrow {
  justify-content: center;
  margin-bottom: 14px;
}

.section-head h2 {
  font-size: clamp(25px,4vw,39px);
  letter-spacing: -1.5px;
  margin: 0 0 12px;
}

.section-head h2 span { color: var(--red); }

.section-head p {
  color: var(--muted);
  font-size: 15px;
  margin: 0;
}

.section-line {
  height: 1px;
  background: linear-gradient(90deg,transparent,#ed123d65,transparent);
}

/* CARDS */

.market-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 14px;
}

.card {
  position: relative;
  overflow: hidden;
  background: linear-gradient(140deg,#180a10d9,#0d080b);
  border: 1px solid #48202c;
  padding: 25px;
  transition: transform .3s,border-color .3s,box-shadow .3s;
}

.card:before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg,transparent,var(--red),transparent);
  transform: translateX(-100%);
  transition: transform .5s;
}

.card:hover {
  transform: translateY(-6px);
  border-color: #b91b40;
  box-shadow: 0 15px 35px #0008,0 0 24px #e3003015;
}

.card:hover:before { transform: translateX(0); }

.market-icon {
  font-size: 25px;
  color: var(--bright);
  margin-bottom: 15px;
  text-shadow: 0 0 16px #ed123d77;
}

.card h3 {
  font-size: 13px;
  margin: 0 0 12px;
}

.status {
  display: inline-block;
  font-size: 10px;
  padding: 5px 9px;
  color: #f58da4;
  border: 1px solid #79253c;
  background: #290b15;
}

.note {
  font-size: 12px;
  line-height: 1.6;
  color: #78676e;
  text-align: center;
  margin: 20px auto 0;
  max-width: 780px;
}

/* TOKENOMICS */

.token-grid {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 13px;
}

.token-card {
  text-align: center;
  padding: 29px 15px;
}

.token-card .value {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(15px,2vw,21px);
  font-weight: 800;
  color: #ff4a6d;
  overflow-wrap: anywhere;
  margin-top: 12px;
  text-shadow: 0 0 15px #ed123d2c;
}

.token-card .stat-label {
  font-size: 9px;
  letter-spacing: 1.5px;
  color: #a08a93;
}

/* ROADMAP */

.roadmap {
  max-width: 850px;
  margin: auto;
  position: relative;
}

.roadmap:before {
  content: "";
  position: absolute;
  left: 18px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: linear-gradient(var(--red),#5a1528,transparent);
}

.phase {
  position: relative;
  padding: 0 0 30px 55px;
}

.phase:before {
  content: "";
  position: absolute;
  left: 11px;
  top: 7px;
  width: 14px;
  height: 14px;
  background: #10060a;
  border: 2px solid var(--red);
  border-radius: 50%;
  box-shadow: 0 0 15px #ed123d77;
}

.phase .card { padding: 23px; }

.phase h3 {
  font-size: 14px;
  color: #ff5474;
  margin: 0 0 10px;
}

.phase p {
  color: #a39199;
  margin: 0;
  line-height: 1.7;
  font-size: 15px;
}

/* FINAL CALL TO ACTION */

.final-panel {
  text-align: center;
  padding: 55px 25px;
  border: 1px solid #6c1a30;
  background: radial-gradient(ellipse at center,#3509167a,transparent 72%),#10080c;
  position: relative;
  overflow: hidden;
}

.final-panel:before {
  content: "";
  position: absolute;
  inset: -100% -50%;
  background: linear-gradient(115deg,transparent 45%,#ff17440b 50%,transparent 55%);
  animation: scan 7s linear infinite;
  pointer-events: none;
}

@keyframes scan {
  to { transform: translateY(50%); }
}

.final-panel h2 {
  font-size: clamp(25px,5vw,44px);
  margin: 0 0 15px;
}

.final-panel p {
  color: #a9979e;
  margin: 0 auto 25px;
  max-width: 570px;
  line-height: 1.7;
}

/* FOOTER AND ANIMATIONS */

footer {
  border-top: 1px solid var(--line);
  padding: 26px 0;
  color: #79666f;
  font-size: 12px;
}

.footer-inner {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: center;
}

.footer-inner strong {
  font-family: 'Orbitron', sans-serif;
  color: #c22b4b;
  font-size: 11px;
}

.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity .7s,transform .7s;
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ENTRY SCREEN */

.entry-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at center,#210711 0,#080507 55%,#030203 100%);
  transition: opacity .9s,visibility .9s;
}

.entry-overlay.dismissed {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.entry-inner {
  text-align: center;
  padding: 24px;
  max-width: 600px;
}

.entry-sigil {
  width: 112px;
  height: 112px;
  border: 1px solid #ff315966;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin: 0 auto 28px;
  box-shadow: 0 0 50px #ed123d30,inset 0 0 30px #ed123d20;
  animation: entryPulse 2.5s infinite;
}

.entry-sigil svg {
  width: 78px;
  height: 78px;
  stroke: #ff3159;
  fill: none;
  stroke-width: 1.4;
  filter: drop-shadow(0 0 8px #ff3159);
}

.entry-title {
  font: 900 clamp(28px,7vw,52px) 'Orbitron',sans-serif;
  letter-spacing: 2px;
  margin: 0 0 12px;
  text-shadow: 0 0 24px #ed123d66;
}

.entry-title span { color: var(--red); }

.entry-copy {
  color: #a88d97;
  letter-spacing: 2px;
  font-size: 12px;
  line-height: 1.7;
  margin-bottom: 28px;
}

.entry-button {
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 16px 24px;
  background: linear-gradient(120deg,#a9002d,#e20b39);
  border: 1px solid #ff3159;
  color: white;
  cursor: pointer;
  box-shadow: 0 0 25px #ed123d42;
  animation: buttonPulse 2s infinite;
}

.entry-button:hover {
  box-shadow: 0 0 42px #ed123d88;
  transform: translateY(-2px);
}

.entry-hint {
  font-size: 10px;
  color: #6e515b;
  letter-spacing: 1px;
  margin-top: 16px;
}

@keyframes entryPulse {
  50% {
    box-shadow: 0 0 70px #ed123d5c,inset 0 0 35px #ed123d40;
    transform: rotate(8deg);
  }
}

@keyframes buttonPulse {
  50% { box-shadow: 0 0 34px #ed123d77; }
}

body.entering { animation: screenShock .55s ease-out; }

@keyframes screenShock {
  0% { transform: translate(0); }
  15% { transform: translate(-5px,2px); }
  30% { transform: translate(5px,-2px); }
  45% { transform: translate(-4px,-1px); }
  60% { transform: translate(3px,2px); }
  75% { transform: translate(-2px,0); }
  100% { transform: translate(0); }
}

.flash {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: #ff123f;
  pointer-events: none;
  opacity: 0;
}

.flash.fire { animation: flashBang .65s ease-out; }

@keyframes flashBang {
  0% { opacity: .7; }
  100% { opacity: 0; }
}

#soundToggle {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 30;
  border: 1px solid #712137;
  background: #10070b;
  color: #f8c6d2;
  padding: 10px 13px;
  font: 10px 'Orbitron', sans-serif;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 0 18px #ed123d1c;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 66px;
  transform: translate(-50%,15px);
  z-index: 40;
  background: #170810;
  border: 1px solid #8e2541;
  color: #ffd7e0;
  padding: 10px 16px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: .25s;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%,0);
}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {
  *,*:before,*:after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }

  .reveal {
    opacity: 1;
    transform: none;
  }
}

/* MOBILE */

@media (max-width:760px) {
  .nav { min-height: 65px; }

  .navlinks {
    display: none;
    position: absolute;
    top: 65px;
    left: 0;
    right: 0;
    padding: 20px 5%;
    background: #0a0608;
    border-bottom: 1px solid var(--line);
    flex-direction: column;
    align-items: stretch;
    gap: 20px;
  }

  .navlinks.open { display: flex; }
  .navlinks a { font-size: 12px; }
  .menu-btn { display: block; }

  .nav>.btn {
    padding: 10px;
    font-size: 9px;
  }

  .hero {
    padding: 60px 0 65px;
    min-height: 0;
  }

  .hero-grid {
    grid-template-columns: 1fr;
    gap: 15px;
  }

  .hero h1 {
    font-size: clamp(43px,12vw,68px);
    letter-spacing: -2.5px;
  }

  .hero-copy { font-size: 16px; }

  .sigil-stage {
    min-height: 310px;
    grid-row: 1;
  }

  .sigil { width: min(68vw,290px); }
  .sigil-halo { width: min(76vw,330px); }

  .sigil-caption {
    bottom: 0;
    font-size: 8px;
  }

  section { padding: 70px 0; }

  .market-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 10px;
  }

  .card { padding: 19px 13px; }

  .token-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 10px;
  }

  .token-card { padding: 24px 10px; }

  .footer-inner {
    flex-direction: column;
    text-align: center;
  }
}

@media (max-width:390px) {
  .brand {
    font-size: 12px;
    gap: 6px;
  }

  .logo-mark {
    width: 33px;
    height: 33px;
  }

  .nav { gap: 7px; }

  .nav>.btn { padding: 9px 8px; }

  .market-grid { grid-template-columns: 1fr 1fr; }

  .contract { gap: 3px; }

  .contract code {
    font-size: 9px;
    padding: 0 4px;
  }

  .contract button {
    font-size: 11px;
    padding: 10px 8px;
  }
}
</style>
</head>

<body>

<!-- ENTRY SCREEN -->

<div class="entry-overlay" id="entryOverlay" role="dialog" aria-modal="true" aria-label="Enter DarkOx Finance">
  <div class="entry-inner">

    <div class="entry-sigil" aria-hidden="true">
